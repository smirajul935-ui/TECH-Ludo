<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T€ÄÇH̾ 𝙇ǗD∅ - Video Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col overflow-hidden">

    <!-- Navbar -->
    <nav class="bg-gray-800 p-4 shadow-md flex justify-between items-center border-b border-gray-700">
        <!-- Stylish Name -->
        <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 tracking-wider drop-shadow-lg">
            T€ÄÇH̾ 𝙇ǗD∅
        </h1>
        
        <div class="flex items-center gap-4">
            <!-- Telegram Top Button (Hidden on very small screens) -->
            <a href="https://t.me/SagarTech99" target="_blank" class="hidden sm:flex items-center gap-2 bg-[#0088cc] hover:bg-[#0077b5] text-white text-sm font-bold py-1.5 px-4 rounded-full transition shadow-[0_0_10px_rgba(0,136,204,0.5)]">
                <i class="fab fa-telegram-plane text-lg"></i> Join
            </a>
            <div id="statusText" class="text-xs md:text-sm font-semibold text-green-400 bg-gray-900 px-3 py-1 rounded-full border border-gray-700">Ready to connect</div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 relative w-full h-full flex items-center justify-center p-4">
        
        <!-- Landing Page Panel -->
        <div id="landingPanel" class="bg-gray-800 p-8 rounded-xl shadow-2xl max-w-md w-full text-center border border-gray-700 relative overflow-hidden">
            
            <!-- Glow Effect -->
            <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-32 h-32 bg-blue-500 rounded-full blur-[80px] opacity-20"></div>

            <h2 class="text-3xl font-extrabold mb-1 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">T€ÄÇH̾ 𝙇ǗD∅</h2>
            <p class="text-gray-400 text-sm mb-6">Connect & Chat with the World</p>
            
            <!-- Main Telegram Join Button -->
            <a href="https://t.me/SagarTech99" target="_blank" class="flex items-center justify-center gap-2 w-full bg-[#0088cc] hover:bg-[#0077b5] text-white font-bold py-3 px-4 rounded-lg mb-6 transition-all duration-300 shadow-[0_0_15px_rgba(0,136,204,0.4)] hover:scale-[1.02]">
                <i class="fab fa-telegram-plane text-2xl animate-pulse"></i> Join Our Telegram
            </a>

            <button id="btnRandom" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg mb-4 transition shadow-lg">
                <i class="fas fa-random mr-2"></i> Start Random Chat
            </button>
            
            <div class="flex items-center my-4 opacity-50">
                <hr class="flex-1 border-gray-500"><span class="px-3 text-sm text-gray-300">OR</span><hr class="flex-1 border-gray-500">
            </div>

            <button id="btnCreateRoom" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg mb-4 transition shadow-lg">
                <i class="fas fa-plus mr-2"></i> Create Private Room
            </button>

            <div class="flex gap-2">
                <input type="text" id="roomCodeInput" placeholder="Enter Room Code" class="flex-1 bg-gray-900 border border-gray-600 text-white rounded-lg px-4 py-2 uppercase outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                <button id="btnJoinRoom" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-5 rounded-lg transition shadow-lg">Join</button>
            </div>
        </div>

        <!-- Video Chat Panel -->
        <div id="videoPanel" class="hidden w-full h-full relative">
            <!-- Remote Video (Main) -->
            <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover rounded-xl bg-black"></video>
            
            <!-- Local Video (PIP) -->
            <video id="localVideo" autoplay playsinline muted class="absolute top-4 right-4 w-28 md:w-48 h-auto object-cover rounded-lg border-2 border-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.3)] bg-gray-800"></video>

            <!-- Room Code Display (For Private) -->
            <div id="roomCodeDisplay" class="hidden absolute top-4 left-4 bg-black/80 px-4 py-2 rounded-lg text-sm font-mono tracking-widest border border-gray-700 shadow-lg">
                CODE: <span id="codeSpan" class="text-green-400 font-bold text-lg"></span>
            </div>

            <!-- Controls -->
            <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900/90 border border-gray-700 px-4 md:px-6 py-3 rounded-full flex gap-3 shadow-2xl backdrop-blur-md">
                <button id="btnToggleAudio" class="bg-gray-700 hover:bg-gray-600 p-3 md:p-4 rounded-full text-white transition"><i class="fas fa-microphone"></i></button>
                <button id="btnToggleVideo" class="bg-gray-700 hover:bg-gray-600 p-3 md:p-4 rounded-full text-white transition"><i class="fas fa-video"></i></button>
                <button id="btnNext" class="hidden bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-full font-bold transition shadow-lg">Next</button>
                <button id="btnEndCall" class="bg-red-600 hover:bg-red-700 px-5 md:px-6 py-2 rounded-full font-bold transition shadow-lg whitespace-nowrap"><i class="fas fa-phone-slash md:hidden"></i><span class="hidden md:inline">End Call</span></button>
            </div>
        </div>

    </main>

    <script type="module" src="./src/app.js"></script>
</body>
</html>
